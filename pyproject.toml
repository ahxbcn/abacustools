[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "abacustools"
version = "0.0.1"
description = "Tools for accompanying using ABACUS"
readme = "README.md"
authors = [
    { name = "ahxbcn", email = "zh20150625@163.com" },
]
license = "LGPL-3.0-or-later"
classifiers = [
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Environment :: Console",
]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "rich",
    "pymatgen",
    "phonopy",
    "seekpath",
    "matplotlib",
    "ase",
    "pydantic",
    "spglib",
]

[project.optional-dependencies]
# Materials Project search and download (`abacustools mp ...`). The client is
# imported lazily so every other command works without it.
mp = ["mp-api"]

[project.scripts]
abacustools = "abacustools.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
abacustools = ["io/input-params.json", "core/default_config.yaml"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
# Rule set documented in AGENTS.md. `l` is the angular-momentum quantum number
# used throughout the NAO, band and DOS code, including the public
# NAOOrbital.l field, so E741 is ignored instead of renaming it.
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]

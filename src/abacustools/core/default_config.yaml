constants:
  hartree2ev: 27.21138386
  bohr2ang: 0.529177249
  # SI values use the CODATA 2018 convention where applicable.
  planck_constant: 6.62607015e-34
  boltzmann_constant: 1.380649e-23
  elementary_charge: 1.602176634e-19
  electron_mass: 9.1093837015e-31
  vacuum_permittivity: 8.8541878128e-12

abacus:
  # Version used to read ABACUS output files. "auto" detects the version from
  # the "ABACUS v..." banner of each running log; an explicit name such as
  # "3.10.1LTS" or "develop" is used when a job log does not declare one, and
  # the version found in the log always wins over a conflicting setting.
  version: "auto"
  # Log markers of each supported ABACUS branch. Entries listed here override
  # the built-in profile of the same name; new entries define new versions.
  versions:
    "3.10.1LTS":
      aliases: ["LTS3.10.1", "3.10.1", "3.10", "lts"]
      version_prefixes: ["3.8", "3.9", "3.10"]
    develop:
      aliases: ["dev", "3.11", "3.12", "beta"]
      version_prefixes: ["3.11", "3.12", "4.", "5."]
  default_basis: "lcao"

# Path to the Henkelman grid-based Bader program used by `postprocess bader`.
# It can also be overridden with the BADER_EXE environment variable or --bader-exe.
bader:
  exe: "bader"

# Chargemol settings for `postprocess ddec`. `exe` names the binary (the
# serial or OpenMP build of the distribution), `atomic_densities` the directory
# that holds its `core_*` and `c2_*` reference density tables. Both can also be
# overridden with the CHARGEMOL_EXE and CHARGEMOL_ATOMIC_DENSITIES environment
# variables or with --chargemol-exe and --atomic-densities.
chargemol:
  exe: "chargemol"
  atomic_densities: null

# Fill these machine-dependent paths in ~/.abacustools/config.yaml.
resources:
  default: apns
  # Orbital variant to use when a library stores SZ/DZP/TZDP subdirectories,
  # such as the SG15 and Dojo libraries. A library can override it with its own
  # `orb_variant` entry.
  orb_variant: "DZP"
  libraries:
    apns:
      pp: null
      orb: null
      # APNS ships one directory per orbital set instead of variant
      # subdirectories; map them here and select them with --variant or
      # `orb_variant`.
      # orb_variants:
      #   efficiency: /path/to/apns-orbitals-efficiency
      #   precision: /path/to/apns-orbitals-precision
    # Pseudopotentials and orbitals from any other source. The directory layout
    # is assumed to follow the APNS convention: one file per element whose name
    # starts with the element symbol, such as Si.upf and
    # Si_gga_7au_100Ry_2s2p1d.orb, without variant directories.
    custom:
      pp: null
      orb: null
    dojo-nc-sr:
      pp: null
      orb: null
    dojo-nc-fr:
      pp: null
      orb: null
    sg15:
      pp: null
      orb: null
      # orb_variant: "TZDP"

input_templates:
  scf:
    calculation: "scf"
    kspacing: 0.14
    symmetry: 1
    scf_thr: 1e-7
    scf_nmax: 100
    smearing_method: "gaussian"
    smearing_sigma: 0.015
    mixing_type: "broyden"
    mixing_beta: 0.8
  relax:
    calculation: "relax"
    kspacing: 0.14
    symmetry: 0
    scf_thr: 1e-7
    scf_nmax: 100
    smearing_method: "gaussian"
    smearing_sigma: 0.015
    mixing_type: "broyden"
    mixing_beta: 0.8
    relax_method: "bfgs"
    relax_nmax: 100
    cal_force: 1
    force_thr_ev: 0.02
  cell-relax:
    calculation: "cell-relax"
    kspacing: 0.14
    symmetry: 0
    scf_thr: 1e-7
    scf_nmax: 100
    smearing_method: "gaussian"
    smearing_sigma: 0.015
    mixing_type: "broyden"
    mixing_beta: 0.8
    relax_method: "cg"
    relax_nmax: 100
    cal_force: 1
    force_thr_ev: 0.02
    cal_stress: 1
    stress_thr: 0.5
  md:
    calculation: "md"
    kspacing: 0.14
    symmetry: 0
    scf_thr: 1e-7
    scf_nmax: 100
    smearing_method: "gaussian"
    smearing_sigma: 0.015
    mixing_type: "broyden"
    mixing_beta: 0.8
    md_type: "nvt"
    md_nstep: 1000
    md_dt: 1.0
    md_tfirst: 300.0

basis_settings:
  lcao:
    basis_type: "lcao"
    ks_solver: "genelpa"
  pw:
    basis_type: "pw"
    ks_solver: "dav_subspace"
    pw_diag_ndim: 2
    pw_diag_nmax: 20

# Workflow submission scripts are disabled by default. Set `generate: true`
# in ~/.abacustools/config.yaml, or use a workflow's --submit-script option.
# The task template may use {abacus_command}, {job_name}, {task_name}, and
# {workflow}. Double braces are required for literal braces in shell code.
submission:
  generate: false
  default: slurm
  abacus_command: "abacus"
  workflow_filename: "submit_{workflow}.sh"
  templates:
    local:
      filename: "run.sh"
      template: |
        #!/bin/bash
        set -euo pipefail
        {abacus_command} > abacus.log 2>&1
      launcher:
        mode: local
    slurm:
      filename: "submit.slurm"
      template: |
        #!/bin/bash
        #SBATCH --job-name={job_name}
        #SBATCH --output=slurm-%j.out
        set -euo pipefail
        {abacus_command} > abacus.log 2>&1
      launcher:
        mode: scheduler
        submit_command: "sbatch --parsable"
        dependency_option: "--dependency=afterok:{dependency_id}"
        id_filter: "cat"
    pbs:
      filename: "submit.pbs"
      template: |
        #!/bin/bash
        #PBS -N {job_name}
        #PBS -j oe
        set -euo pipefail
        cd "$PBS_O_WORKDIR"
        {abacus_command} > abacus.log 2>&1
      launcher:
        mode: scheduler
        submit_command: "qsub"
        dependency_option: "-W depend=afterok:{dependency_id}"
        id_filter: "cat"
    lsf:
      filename: "submit.lsf"
      template: |
        #!/bin/bash
        #BSUB -J {job_name}
        #BSUB -o lsf-%J.out
        set -euo pipefail
        cd "$LS_SUBCWD"
        {abacus_command} > abacus.log 2>&1
      launcher:
        mode: scheduler
        submit_command: "bsub"
        dependency_option: "-w done({dependency_id})"
        id_filter: "sed -n 's/.*<\\([0-9][0-9]*\\)>.*/\\1/p'"
  # One configuration file for a whole batch of prepared jobs, written next to
  # the generated directories by `job prepare --submit-config`. The template is
  # rendered with {examples} (the directory names as a JSON array), {count},
  # {job_type} and {abacus_command}; braces that are not one of those
  # placeholders, such as the ones of a JSON object, are left alone. Point
  # `template_file` at a file of your own - an abacustest or Bohrium job file,
  # for example - to use it instead of the packaged template. Review the image,
  # the machine type and the command of the packaged template before submitting.
  batch:
    generate: false
    filename: "job.json"
    template_file: null
    template: |
      {
        "comments": [
          "Batch configuration written by `abacustools job prepare --submit-config`.",
          "Fill in the Bohrium account, image and machine type, then submit it",
          "with `abacustest submit -j job.json` from this directory."
        ],
        "config": {
          "bohrium_username": "",
          "bohrium_password": "",
          "bohrium_project_id": 0
        },
        "save_path": "result",
        "run_dft": [
          {
            "image": "registry.dp.tech/dptech/abacus-stable:LTSv3.10",
            "example": {examples},
            "bohrium": {
              "scass_type": "c32_m128_cpu",
              "job_type": "container",
              "platform": "ali"
            },
            "command": "{abacus_command} > log",
            "outputs": []
          }
        ],
        "post_dft": {
          "image": "registry.dp.tech/dptech/abacustest:latest",
          "metrics": {
            "path": {examples},
            "dft_type": "abacus",
            "metrics_name": ["scf_steps", "total_time", "converge", "normal_end"],
            "save_file": "metrics.json"
          },
          "outputs": []
        }
      }
